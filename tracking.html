<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suivi de commande · Strand</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#9d3e00",
            "on-primary": "#ffffff",
            "primary-container": "#ffdbcc",
            "on-primary-container": "#7b2f00",
            tertiary: "#35664a",
            surface: "#fafaf9",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f4f3f1",
            "on-surface": "#1a1c1a",
            "on-surface-variant": "#594238",
            outline: "#8c7166",
            "outline-variant": "#d8c2b8",
            background: "#fffbff"
          },
          fontFamily: {
            sans: ["Inter", "system-ui", "sans-serif"]
          }
        }
      }
    };
  </script>
  <style>
    body { font-family: Inter, system-ui, sans-serif; }
    .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; }
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen antialiased">
  <header class="bg-surface-container-lowest/95 backdrop-blur-md border-b border-outline-variant/40 sticky top-0 z-40">
    <div class="max-w-3xl mx-auto px-5 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 text-sm font-medium text-on-surface-variant hover:text-primary transition">
        <span class="material-symbols-outlined text-[20px]">arrow_back</span>
        Retour
      </a>
      <span class="text-xs uppercase tracking-[0.18em] text-on-surface-variant font-medium">Suivi de commande</span>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-5 py-12 md:py-16">
    <div class="text-center mb-10">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-primary-container mb-4">
        <span class="material-symbols-outlined text-2xl text-on-primary-container">local_shipping</span>
      </div>
      <h1 class="text-3xl md:text-4xl font-semibold tracking-tight text-on-surface mb-2">Suivre votre commande</h1>
      <p class="text-sm text-on-surface-variant max-w-md mx-auto">Entrez le code de suivi reçu par email ou utilisez le lien sécurisé qui vous a été envoyé.</p>
    </div>

    <form id="lookup-form" class="bg-surface-container-lowest rounded-2xl border border-outline-variant/40 shadow-sm p-2 flex gap-2 mb-8 max-w-xl mx-auto">
      <input id="tracking-code" type="text" maxlength="32" placeholder="Code de suivi"
             class="flex-1 bg-transparent px-4 py-3.5 text-sm outline-none placeholder:text-outline" />
      <button type="submit" class="bg-primary text-on-primary px-6 py-3 rounded-xl text-sm font-semibold uppercase tracking-wider hover:opacity-90 active:scale-[0.98] transition-all">
        Suivre
      </button>
    </form>

    <div id="loading" class="hidden text-center text-sm text-on-surface-variant py-8">Recherche en cours…</div>
    <div id="error" class="hidden max-w-xl mx-auto text-sm text-red-700 bg-red-50 border border-red-200 rounded-xl p-4"></div>

    <div id="result" class="hidden max-w-xl mx-auto space-y-6">
      <div class="bg-surface-container-lowest rounded-2xl border border-outline-variant/40 shadow-sm p-6 space-y-4">
        <div class="flex items-center justify-between">
          <span class="text-xs uppercase tracking-wider text-on-surface-variant">Commande</span>
          <span id="order-id" class="font-semibold text-primary"></span>
        </div>
        <div class="h-px bg-outline-variant/50"></div>
        <div class="flex items-center justify-between">
          <span class="text-xs uppercase tracking-wider text-on-surface-variant">Statut</span>
          <span id="status" class="inline-flex items-center gap-1.5 font-semibold text-primary">
            <span class="w-1.5 h-1.5 rounded-full bg-primary"></span>
            <span id="status-text"></span>
          </span>
        </div>
        <div class="h-px bg-outline-variant/50"></div>
        <div class="flex items-center justify-between">
          <span class="text-xs uppercase tracking-wider text-on-surface-variant">Dernière mise à jour</span>
          <span id="updated" class="font-medium"></span>
        </div>
      </div>

      <div class="bg-surface-container-lowest rounded-2xl border border-outline-variant/40 shadow-sm p-6">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-on-surface-variant mb-5">Historique</h2>
        <div id="timeline" class="space-y-5 text-sm"></div>
      </div>
    </div>
  </main>

  <script src="scripts/api.js"></script>
  <script src="scripts/tracking.js"></script>
</body>
</html>
